  /api/discovery/recommendations/:
    get:
      operationId: discovery_recommendations_list
      description: |-
        Recommend courses from the student's LearningProfile.

        Optional query params (topics/topic_text/modality) act as a fallback for
        students who skipped the conversation.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Consulta de texto para recomendações sem perfil.
      tags:
      - discovery
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveryResult'
          description: ''
  /api/discovery/search/:
    get:
      operationId: discovery_search_list
      description: Search published courses with filters and a transparent ranking.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: ID da categoria.
      - in: query
        name: free
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: number
          format: double
      - in: query
        name: modality
        schema:
          type: string
          enum:
          - ONLINE
          - PRESENTIAL
      - in: query
        name: q
        schema:
          type: string
        description: Termos de pesquisa textual.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - GROUP
          - INDIVIDUAL
      tags:
      - discovery
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveryResult'
          description: ''
