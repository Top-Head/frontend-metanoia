components:
  schemas:
    AIConversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/AIConversationStatusEnum'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AIMessage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - messages
      - updated_at
    AIConversationStatusEnum:
      enum:
      - ACTIVE
      - COMPLETED
      - SKIPPED
      type: string
      description: |-
        * `ACTIVE` - Ativa
        * `COMPLETED` - Concluída
        * `SKIPPED` - Ignorada
    AIMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/AIMessageRoleEnum'
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - role
    AIMessageRoleEnum:
      enum:
      - USER
      - ASSISTANT
      - SYSTEM
      type: string
      description: |-
        * `USER` - Utilizador
        * `ASSISTANT` - Assistente
        * `SYSTEM` - Sistema
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
      required:
      - id
      - name
      - slug
    CourseDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        image:
          type: string
          maxLength: 500
        description:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        mentor:
          allOf:
          - $ref: '#/components/schemas/MentorSummary'
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        modality:
          $ref: '#/components/schemas/ModalityEnum'
        location:
          type: string
          maxLength: 255
        price_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 8
        is_free:
          type: boolean
          readOnly: true
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Obrigatório para aulas de grupo; deve ser positivo.
        total_capacity:
          type: integer
          readOnly: true
        total_enrolled:
          type: integer
          readOnly: true
        days_of_week:
          type: array
          items:
            type: integer
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/Status137Enum'
        session_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/CourseSession'
          readOnly: true
      required:
      - category
      - created_at
      - days_of_week
      - id
      - is_free
      - mentor
      - session_count
      - sessions
      - title
      - total_capacity
