name: metanoia
on:
  pull_request:
    branches: [vps]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: 45.8.132.133
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/site
            git pull origin vps
            npm ci
            npm run build
            pm2 restart site || pm2 start npm --name site -- run start -- --port 3000
            echo "Site público atualizado!"
